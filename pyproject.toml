[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-hook-guard"
version = "1.0.0"
description = "Deterministic Claude Code settings.json hook linter and PreToolUse JSONL simulator."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-hook-guard = "claude_hook_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
