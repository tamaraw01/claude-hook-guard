[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-hook-guard"
version = "1.0.0"
description = "Deterministic Claude Code hook settings linter and PreToolUse simulator."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
claude-hook-guard = "claude_hook_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
